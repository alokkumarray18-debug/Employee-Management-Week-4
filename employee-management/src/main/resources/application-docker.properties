# ===== DOCKER profile =====
# Used when the app runs inside the docker-compose stack; "mysql" resolves
# to the mysql service name on the compose network.

spring.datasource.url=jdbc:mysql://mysql:3306/employee_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER:employee_user}
spring.datasource.password=${MYSQL_PASSWORD:employee_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

logging.level.org.hibernate.SQL=INFO
logging.level.com.trainee.employeemanagement=INFO
