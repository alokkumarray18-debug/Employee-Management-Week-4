# ===== LOCAL profile =====
# Used for individual developer machines. Points at a MySQL instance
# running on localhost with a local-only database.
#
# The password is read from the LOCAL_DB_PASSWORD environment variable so no
# real credential ever needs to be committed to source control; it falls back
# to "root" only so the app still boots out-of-the-box on a fresh MySQL
# install with default local credentials.

spring.datasource.url=jdbc:mysql://localhost:3306/employee_db_local?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${LOCAL_DB_USERNAME:root}
spring.datasource.password=${LOCAL_DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Safe to auto-update schema while developing locally
spring.jpa.hibernate.ddl-auto=update

logging.level.org.hibernate.SQL=DEBUG
logging.level.com.trainee.employeemanagement=DEBUG
