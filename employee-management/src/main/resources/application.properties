# ===== Common settings shared by all profiles =====
spring.application.name=employee-management

# Active profile - override with: --spring.profiles.active=dev (etc.)
# or an environment variable: SPRING_PROFILES_ACTIVE=dev
spring.profiles.active=docker

# JPA / Hibernate common settings
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Jackson - don't fail on empty beans, pretty print for readability while developing
spring.jackson.serialization.indent-output=true

# Server
server.port=${PORT:8080}

# Logging - include the correlation id (set by CorrelationIdFilter) on every line
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [cid=%X{correlationId}] %logger{36} - %msg%n

# Swagger / OpenAPI UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Actuator - expose only health/info publicly
management.endpoints.web.exposure.include=health,info
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
