# ===== QA profile =====
# QA/testing environment used for structured test cycles before release.

spring.datasource.url=jdbc:mysql://qa-db-server:3306/employee_db_qa?useSSL=false&serverTimezone=UTC
spring.datasource.username=qa_user
spring.datasource.password=${QA_DB_PASSWORD:qa_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema should already be provisioned in QA - never auto-update
spring.jpa.hibernate.ddl-auto=validate

logging.level.org.hibernate.SQL=WARN
logging.level.com.trainee.employeemanagement=WARN
