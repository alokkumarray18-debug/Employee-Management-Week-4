# ===== DEV profile =====
# Shared development environment, used by the whole team to integrate work.

spring.datasource.url=jdbc:mysql://dev-db-server:3306/employee_db_dev?useSSL=false&serverTimezone=UTC
spring.datasource.username=dev_user
spring.datasource.password=${DEV_DB_PASSWORD:dev_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Validate schema instead of auto-updating - migrations should be controlled
spring.jpa.hibernate.ddl-auto=validate

logging.level.org.hibernate.SQL=INFO
logging.level.com.trainee.employeemanagement=INFO
