# Test profile - uses an in-memory H2 database so the Spring context
# (EmployeeManagementApplicationTests) can boot without a real MySQL server.
spring.datasource.url=jdbc:h2:mem:employee_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
